// ============================================================
// REGRESSÃO LINEAR
// ============================================================

function calcLinearOLS(data) {

    var n = data.length;

    if (n < 2) {

        return {
            beta0: 0,
            beta1: 0
        };

    }


    var sx = 0;
    var sy = 0;
    var sxy = 0;
    var sx2 = 0;


    for (var i = 0; i < n; i++) {

        sx += data[i].x;

        sy += data[i].y;

        sxy +=
        data[i].x *
        data[i].y;

        sx2 +=
        data[i].x *
        data[i].x;

    }


    var denom =
    n * sx2 -
    sx * sx;


    var beta1 =
    denom !== 0
    ?
    (
        n * sxy -
        sx * sy
    )
    /
    denom
    :
    0;


    var beta0 =
    (
        sy -
        beta1 * sx
    )
    /
    n;


    return {
        beta0: beta0,
        beta1: beta1
    };

}



// ============================================================
// ELIMINAÇÃO DE GAUSS
// ============================================================

function gaussianSolve(A, b) {

    var n = b.length;


    A =
    A.map(
        function(row) {

            return row.slice();

        }
    );


    b =
    b.slice();


    for (var i = 0; i < n; i++) {


        var maxRow = i;


        for (var k = i + 1; k < n; k++) {

            if (
                Math.abs(A[k][i])
                >
                Math.abs(A[maxRow][i])
            ) {

                maxRow = k;

            }

        }


        var tempRow =
        A[i];

        A[i] =
        A[maxRow];

        A[maxRow] =
        tempRow;


        var tempB =
        b[i];

        b[i] =
        b[maxRow];

        b[maxRow] =
        tempB;


        var pivot =
        A[i][i];


        if (
            Math.abs(pivot)
            <
            1e-12
        ) {

            return new Array(n).fill(0);

        }


        for (var j = i; j < n; j++) {

            A[i][j] /=
            pivot;

        }


        b[i] /=
        pivot;


        for (var kk = 0; kk < n; kk++) {


            if (kk === i) {

                continue;

            }


            var factor =
            A[kk][i];


            for (var jj = i; jj < n; jj++) {

                A[kk][jj]
                -=
                factor *
                A[i][jj];

            }


            b[kk]
            -=
            factor *
            b[i];

        }

    }


    return b;

}



// ============================================================
// REGRESSÃO POLINOMIAL
// ============================================================

function calcPolynomialFit(data, degree) {


    degree =
    Math.max(
        1,
        Math.min(
            degree,
            data.length - 1,
            10
        )
    );


    var m =
    degree + 1;


    var A = [];


    for (var i = 0; i < m; i++) {

        A.push(
            new Array(m).fill(0)
        );

    }


    var B =
    new Array(m).fill(0);


    for (var row = 0; row < m; row++) {


        for (var col = 0; col < m; col++) {


            var sum = 0;


            for (var p = 0; p < data.length; p++) {

                sum +=
                Math.pow(
                    data[p].x,
                    row + col
                );

            }


            A[row][col] =
            sum;

        }


        var sumB = 0;


        for (var q = 0; q < data.length; q++) {

            sumB +=
            data[q].y
            *
            Math.pow(
                data[q].x,
                row
            );

        }


        B[row] =
        sumB;

    }


    return gaussianSolve(
        A,
        B
    );

}



// ============================================================
// AVALIAR POLINÔMIO
// ============================================================

function evalPoly(coeffs, x) {

    var y = 0;


    for (var i = 0; i < coeffs.length; i++) {

        y +=
        coeffs[i]
        *
        Math.pow(
            x,
            i
        );

    }


    return y;

}



// ============================================================
// GERAR CURVA
// ============================================================

function buildCurveData(fn, xmin, xmax, step) {


    var arr = [];


    for (
        var x = xmin;
        x <= xmax + 0.000000001;
        x += step
    ) {


        var y =
        fn(x);


        if (
            Number.isFinite(y)
        ) {


            arr.push({

                x:
                Number(
                    x.toFixed(2)
                ),

                y:
                y

            });

        }

    }


    return arr;

}



// ============================================================
// MSE
// ============================================================

function calcMSE(data, fn) {


    if (
        data.length === 0
    ) {

        return 0;

    }


    var sse = 0;


    for (var i = 0; i < data.length; i++) {


        var prediction =
        fn(
            data[i].x
        );


        var error =
        data[i].y -
        prediction;


        sse +=
        error *
        error;

    }


    return sse / data.length;

}



// ============================================================
// ACURÁCIA PARA REGRESSÃO
// ============================================================

function calcAccuracy(data, fn, tolerance) {


    if (
        data.length === 0
    ) {

        return 0;

    }


    var correct = 0;


    for (var i = 0; i < data.length; i++) {


        var prediction =
        fn(
            data[i].x
        );


        var absoluteError =
        Math.abs(
            data[i].y -
            prediction
        );


        if (
            absoluteError <= tolerance
        ) {

            correct++;

        }

    }


    return (correct / data.length) * 100;

}



// ============================================================
// VARIÂNCIA AMOSTRAL DOS VALORES Y
// ============================================================

function calcVariance(data) {


    if (
        data.length < 2
    ) {

        return 0;

    }


    var mean = 0;


    for (
        var i = 0;
        i < data.length;
        i++
    ) {

        mean +=
        data[i].y;

    }


    mean =
    mean /
    data.length;


    var sumSquared =
    0;


    for (
        var j = 0;
        j < data.length;
        j++
    ) {


        var diff =
        data[j].y -
        mean;


        sumSquared +=
        diff *
        diff;

    }


    return sumSquared / (data.length - 1);

}

}

// EQUAÇÃO POLINOMIAL

function formatPolynomialEquation(coeffs) {


    if (
        !coeffs ||
        coeffs.length === 0
    ) {

        return "ŷ = 0";

    }


    var terms = [];

        i < coeffs.length;
        i++
    ) {


        var c =
        coeffs[i];


        if (
            Math.abs(c)
            <
            0.00001
        ) {

            continue;

        }


        var term =
        "";


        if (
            i === 0
        ) {

            term =
            c.toFixed(2);

        }


        else if (
            i === 1
        ) {

            term =
            (
                c >= 0
                ?
                "+ "
                :
                "- "
            )
            +
            Math.abs(c).toFixed(2)
            +
            "x";

        }


        else {

            term =
            (
                c >= 0
                ?
                "+ "
                :
                "- "
            )
            +
            Math.abs(c).toFixed(2)
            +
            "x<sup>"
            +
            i
            +
            "</sup>";

        }


        terms.push(
            term
        );

    }


    if (
        terms.length === 0
    ) {

        return "ŷ = 0";

    }


    return "ŷ = " + terms.join(" ");

}



// ============================================================
// PLUGIN
// ============================================================

var customPlugin = {


    id:
    "customPlugin",


    beforeDatasetsDraw:
    function(chart) {


        if (
            !showResiduals.checked
        ) {

            return;

        }


        var dataPoints =
        chart.canvas.id === "chartTrain"
        ?
        trainPoints
        :
        testPoints;


        var ctx =
        chart.ctx;


        var xAxis =
        chart.scales.x;


        var yAxis =
        chart.scales.y;


        ctx.save();



        if (
            chart.isDatasetVisible(1)
        ) {


            ctx.strokeStyle =
            "rgba(31,143,78,0.45)";


            ctx.lineWidth =
            1.2;


            ctx.setLineDash(
                [4,3]
            );


            for (
                var i = 0;
                i < dataPoints.length;
                i++
            ) {


                var p =
                dataPoints[i];


                var yHat =
                currentLinear.beta0
                +
                currentLinear.beta1 *
                p.x;


                ctx.beginPath();


                ctx.moveTo(

                    xAxis.getPixelForValue(
                        p.x
                    ),

                    yAxis.getPixelForValue(
                        p.y
                    )

                );


                ctx.lineTo(

                    xAxis.getPixelForValue(
                        p.x
                    ),

                    yAxis.getPixelForValue(
                        yHat
                    )

                );


                ctx.stroke();

            }

        }



        if (
            chart.isDatasetVisible(2)
        ) {


            ctx.strokeStyle =
            "rgba(217,48,37,0.35)";


            ctx.lineWidth =
            1.2;


            ctx.setLineDash(
                [2,2]
            );


            for (
                var j = 0;
                j < dataPoints.length;
                j++
            ) {


                var pp =
                dataPoints[j];


                var yHatRed =
                evalPoly(
                    currentPolyCoeffs,
                    pp.x
                );


                ctx.beginPath();


                ctx.moveTo(

                    xAxis.getPixelForValue(
                        pp.x
                    ),

                    yAxis.getPixelForValue(
                        pp.y
                    )

                );


                ctx.lineTo(

                    xAxis.getPixelForValue(
                        pp.x
                    ),

                    yAxis.getPixelForValue(
                        yHatRed
                    )

                );


                ctx.stroke();

            }

        }


        ctx.restore();

    },


    afterDraw:
    function(chart) {


        if (
            !showLabels.checked
        ) {

            return;

        }


        var dataPoints =
        chart.canvas.id === "chartTrain"
        ?
        trainPoints
        :
        testPoints;


        var ctx =
        chart.ctx;


        var meta =
        chart.getDatasetMeta(0);


        ctx.save();


        ctx.font =
        "bold 10px Arial";


        ctx.fillStyle =
        "#000";


        ctx.textAlign =
        "center";


        meta.data.forEach(

            function(el, idx) {


                var p =
                dataPoints[idx];


                if (p) {


                    ctx.fillText(

                        "("
                        +
                        p.x
                        +
                        ", "
                        +
                        p.y
                        +
                        ")",

                        el.x,

                        el.y - 10

                    );

                }

            }

        );


        ctx.restore();

    }

};



// ============================================================
// CRIAÇÃO DOS GRÁFICOS
// ============================================================

function createChart(

    dataPoints,
    pointColor,
    pointLabel
) {

    document
    .getElementById(canvasId)
    .getContext("2d");


    return new Chart(

        ctx,

        {

            type:
            "scatter",


            data: {

                datasets: [


                    {

                        label:
                        pointLabel,

                        data:
                        dataPoints,

                        backgroundColor:
                        pointColor,

                        borderColor:
                        pointColor,

                        pointRadius:
                        5,

                        pointHoverRadius:
                        7,

                        pointHitRadius:
                        10

                    },


                    {

                        label:
                        "Modelo adequado — linear",

                        data:
                        [],

                        type:
                        "line",

                        borderColor:
                        "#1f8f4e",

                        backgroundColor:
                        "#1f8f4e",

                        borderWidth:
                        3,

                        fill:
                        false,

                        pointRadius:
                        0,

                        tension:
                        0

                    },


                    {

                        label:
                        "Modelo com overfitting — não linear",

                        data:
                        [],

                        type:
                        "line",

                        borderColor:
                        "#d93025",

                        backgroundColor:
                        "#d93025",

                        borderWidth:
                        3,

                        fill:
                        false,

                        pointRadius:
                        0,

                        tension:
                        0.15

                    }

                ]

            },


            options: {


                responsive:
                true,


                animation:
                false,


                interaction: {

                    mode:
                    "nearest",

                    intersect:
                    false

                },


                plugins: {


                    legend: {

                        display:
                        true,

                        position:
                        "top"

                    }

                },


                scales: {


                    x: {

                        type:
                        "linear",

                        min:
                        0,

                        max:
                        10,


                        title: {

                            display:
                            true,

                            text:
                            "Horas de estudo",

                            font: {

                                size:
                                14,

                                weight:
                                "bold"

                            }

                        }

                    },


                    y: {

                        min:
                        0,

                        max:
                        100,


                        title: {

                            display:
                            true,

                            text:
                            "Nota na prova",

                            font: {

                                size:
                                14,

                                weight:
                                "bold"

                            }

                        }

                    }

                }

            },


            plugins: [

                customPlugin

            ]

        }

    );

}



// ============================================================
// INSTANCIA OS GRÁFICOS
// ============================================================

var chartTrain =
createChart(
    "chartTrain",
    trainPoints,
    "#1565c0",
    "Dados de treino"
);


var chartTest =
createChart(
    "chartTest",
    testPoints,
    "#7b1fa2",
    "Dados de teste"
);



// ============================================================
// ATUALIZA MODELOS
// ============================================================

function atualizarModelos() {


    // ========================================================
    // ATUALIZA AS TABELAS
    // ========================================================

    atualizarTabela(
        "trainDataTable",
        trainPoints
    );


    atualizarTabela(
        "testDataTable",
        testPoints
    );



    // ========================================================
    // MODELO LINEAR
    // ========================================================

    if (
        autoLinear.checked
    ) {


        currentLinear =
        calcLinearOLS(
            trainPoints
        );


        beta0Slider.disabled =
        true;


        beta1Slider.disabled =
        true;


        beta0Slider.value =
        currentLinear.beta0;


        beta1Slider.value =
        currentLinear.beta1;

    }


    else {


        beta0Slider.disabled =
        false;


        beta1Slider.disabled =
        false;


        currentLinear.beta0 =
        parseFloat(
            beta0Slider.value
        );


        currentLinear.beta1 =
        parseFloat(
            beta1Slider.value
        );

    }



    // ========================================================
    // MODELO POLINOMIAL
    // ========================================================

    var degree =
    parseInt(
        degreeSlider.value
    );


    currentPolyCoeffs =
    calcPolynomialFit(
        trainPoints,
        degree
    );



    // ========================================================
    // CONTROLES
    // ========================================================

    beta0Val.innerText =
    currentLinear.beta0.toFixed(2);


    beta1Val.innerText =
    currentLinear.beta1.toFixed(2);


    degreeVal.innerText =
    degree;



    // ========================================================
    // CURVA VERDE
    // ========================================================

    var greenCurve =
    buildCurveData(

        function(x) {

            return currentLinear.beta0 + currentLinear.beta1 * x;

        },

        0,

        10,

        0.05

    );



    // ========================================================
    // CURVA VERMELHA
    // ========================================================

    var redCurve =
    buildCurveData(

        function(x) {

            return evalPoly(currentPolyCoeffs, x);

        },

        0,

        10,

        0.05

    );



    // ========================================================
    // DADOS DOS GRÁFICOS
    // ========================================================

    chartTrain.data.datasets[0].data =
    trainPoints;


    chartTrain.data.datasets[1].data =
    greenCurve;


    chartTrain.data.datasets[2].data =
    redCurve;



    chartTest.data.datasets[0].data =
    testPoints;


    chartTest.data.datasets[1].data =
    greenCurve;


    chartTest.data.datasets[2].data =
    redCurve;



    // ========================================================
    // MSE
    // ========================================================

    var mseGreenTrain =
    calcMSE(

        trainPoints,

        function(x) {

            return currentLinear.beta0 + currentLinear.beta1 * x;

        }

    );


    var mseGreenTest =
    calcMSE(

        testPoints,

        function(x) {

            return currentLinear.beta0 + currentLinear.beta1 * x;

        }

    );


    var mseRedTrain =
    calcMSE(

        trainPoints,

        function(x) {

            return evalPoly(currentPolyCoeffs, x);

        }

    );


    var mseRedTest =
    calcMSE(

        testPoints,

        function(x) {

            return evalPoly(currentPolyCoeffs, x);

        }

    );



    // ========================================================
    // ACURÁCIA
    // ========================================================

    var accGreenTrain =
    calcAccuracy(

        trainPoints,

        function(x) {

            return currentLinear.beta0 + currentLinear.beta1 * x;

        },

        accuracyTolerance

    );


    var accGreenTest =
    calcAccuracy(

        testPoints,

        function(x) {

            return currentLinear.beta0 + currentLinear.beta1 * x;

        },

        accuracyTolerance

    );


    var accRedTrain =
    calcAccuracy(

        trainPoints,

        function(x) {

            return evalPoly(currentPolyCoeffs, x);

        },

        accuracyTolerance

    );


    var accRedTest =
    calcAccuracy(

        testPoints,

        function(x) {

            return evalPoly(currentPolyCoeffs, x);

        },

        accuracyTolerance

    );



    // ========================================================
    // VARIÂNCIA
    // ========================================================

    var varianceTrain =
    calcVariance(
        trainPoints
    );


    var varianceTest =
    calcVariance(
        testPoints
    );



    // ========================================================
    // EQUAÇÕES
    // ========================================================

    greenEquation.innerHTML =
    formatLinearEquation(
        currentLinear.beta0,
        currentLinear.beta1
    );


    redEquation.innerHTML =
    formatPolynomialEquation(
        currentPolyCoeffs
    );



    // ========================================================
    // PAINEL VERDE
    // ========================================================

    greenMetrics.innerHTML =

    "<div class=\"metric-group\">"

    +

    "<div class=\"metric-title\">Dados de Treino</div>"

    +

    "<strong>MSE:</strong> "

    +

    mseGreenTrain.toFixed(2)

    +

    "<br>"

    +

    "<strong>Acurácia (±"

    +

    accuracyTolerance

    +

    " pontos):</strong> "

    +

    accGreenTrain.toFixed(2)

    +

    "%"

    +

    "<br>"

    +

    "<strong>Variância dos dados:</strong> "

    +

    varianceTrain.toFixed(2)

    +

    "</div>"

    +

    "<div class=\"metric-group\">"

    +

    "<div class=\"metric-title\">Dados de Teste</div>"

    +

    "<strong>MSE:</strong> "

    +

    mseGreenTest.toFixed(2)

    +

    "<br>"

    +

    "<strong>Acurácia (±"

    +

    accuracyTolerance

    +

    " pontos):</strong> "

    +

    accGreenTest.toFixed(2)

    +

    "%"

    +

    "<br>"

    +

    "<strong>Variância dos dados:</strong> "

    +

    varianceTest.toFixed(2)

    +

    "</div>"

    +

    "<div class=\"metric-group\">"

    +

    "<strong>Complexidade:</strong> baixa"

    +

    "<br>"

    +

    "<strong>Objetivo:</strong> capturar a tendência geral."

    +

    "</div>";



    // ========================================================
    // PAINEL VERMELHO
    // ========================================================

    redMetrics.innerHTML =

    "<div class=\"metric-group\">"

    +

    "<strong>Grau do polinômio:</strong> "

    +

    degree

    +

    "</div>"

    +

    "<div class=\"metric-group\">"

    +

    "<div class=\"metric-title\">Dados de Treino</div>"

    +

    "<strong>MSE:</strong> "

    +

    mseRedTrain.toFixed(2)

    +

    "<br>"

    +

    "<strong>Acurácia (±"

    +

    accuracyTolerance

    +

    " pontos):</strong> "

    +

    accRedTrain.toFixed(2)

    +

    "%"

    +

    "<br>"

    +

    "<strong>Variância dos dados:</strong> "

    +

    varianceTrain.toFixed(2)

    +

    "</div>"

    +

    "<div class=\"metric-group\">"

    +

    "<div class=\"metric-title\">Dados de Teste</div>"

    +

    "<strong>MSE:</strong> "

    +

    mseRedTest.toFixed(2)

    +

    "<br>"

    +

    "<strong>Acurácia (±"

    +

    accuracyTolerance

    +

    " pontos):</strong> "

    +

    accRedTest.toFixed(2)

    +

    "%"

    +

    "<br>"

    +

    "<strong>Variância dos dados:</strong> "

    +

    varianceTest.toFixed(2)

    +

    "</div>"

    +

    "<div class=\"metric-group\">"

    +

    "<strong>Complexidade:</strong> "

    +

    (
        degree <= 3
        ?
        "baixa"
        :
        degree <= 6
        ?
        "média"
        :
        "alta"
    )

    +

    "</div>";



    // ========================================================
    // EXPLICAÇÃO
    // ========================================================

    if (
        degree <= 3
    ) {


        redExplanation.innerHTML =

        "Com grau <strong>"

        +

        degree

        +

        "</strong>, a curva ainda apresenta baixa flexibilidade. "

        +

        "Compare o desempenho nos conjuntos de treino e teste.";

    }


    else if (
        degree <= 6
    ) {


        redExplanation.innerHTML =

        "Com grau <strong>"

        +

        degree

        +

        "</strong>, a curva começa a acompanhar mais de perto os dados de treinamento. "

        +

        "Observe se a melhora de treino também ocorre no conjunto de teste.";

    }


    else {


        redExplanation.innerHTML =

        "Com grau <strong>"

        +

        degree

        +

        "</strong>, o modelo possui alta flexibilidade. "

        +

        "Ele pode apresentar desempenho muito bom no treino sem apresentar a mesma capacidade de generalização no teste. "

        +

        "Esse comportamento é característico de <strong>overfitting</strong>.";

    }



    chartTrain.update("none");

    chartTest.update("none");

}



// ============================================================
// VISIBILIDADE
// ============================================================

function atualizarVisibilidadeModelos() {


    var mostrarVerde =
    showLinearModel.checked;


    var mostrarVermelho =
    showOverfitModel.checked;



    chartTrain.setDatasetVisibility(
        1,
        mostrarVerde
    );


    chartTrain.setDatasetVisibility(
        2,
        mostrarVermelho
    );


    chartTest.setDatasetVisibility(
        1,
        mostrarVerde
    );


    chartTest.setDatasetVisibility(
        2,
        mostrarVermelho
    );


    greenCard.style.display =
    mostrarVerde
    ?
    "block"
    :
    "none";


    redCard.style.display =
    mostrarVermelho
    ?
    "block"
    :
    "none";


    chartTrain.update("none");

    chartTest.update("none");

}



// ============================================================
// EVENTOS
// ============================================================

showLinearModel.addEventListener(

"change",

function() {

    atualizarVisibilidadeModelos();

}

);


showOverfitModel.addEventListener(

"change",

function() {

    atualizarVisibilidadeModelos();

}

);


autoLinear.addEventListener(

"change",

function() {

    atualizarModelos();

}

);


showLabels.addEventListener(

"change",

function() {

    chartTrain.update("none");

    chartTest.update("none");

}

);


showResiduals.addEventListener(

"change",

function() {

    chartTrain.update("none");

    chartTest.update("none");

}

);


beta0Slider.addEventListener(

"input",

function() {

    atualizarModelos();

}

);


beta1Slider.addEventListener(

"input",

function() {

    atualizarModelos();

}

);


degreeSlider.addEventListener(

"input",

function() {

    atualizarModelos();

}

);



// ============================================================
// ADICIONAR PONTO
// ============================================================

document
.getElementById("addPointBtn")
.addEventListener(

"click",

function() {


    var xVal =
    parseFloat(
        inputX.value
    );


    var yVal =
    parseFloat(
        inputY.value
    );


    if (

        !isNaN(xVal)

        &&

        !isNaN(yVal)

        &&

        xVal >= 0

        &&

        xVal <= 10

        &&

        yVal >= 0

        &&

        yVal <= 100

    ) {


        trainPoints.push({

            x:
            Number(
                xVal.toFixed(1)
            ),

            y:
            Math.round(
                yVal
            )

        });


        atualizarModelos();

        atualizarVisibilidadeModelos();

    }

}

);



// ============================================================
// ADICIONAR RUÍDO
// ============================================================

document
.getElementById("addNoiseBtn")
.addEventListener(

"click",

function() {


    var xVal =
    Number(
        (
            Math.random() *
            10
        )
        .toFixed(1)
    );


    var base =
    18 +
    7 *
    xVal;


    var noise =
    Math.random() *
    36 -
    18;


    var yVal =
    Math.round(
        base +
        noise
    );


    yVal =
    Math.max(
        0,
        Math.min(
            100,
            yVal
        )
    );


    trainPoints.push({

        x:
        xVal,

        y:
        yVal

    });


    atualizarModelos();

    atualizarVisibilidadeModelos();

}

);



// ============================================================
// REMOVER ÚLTIMO
// ============================================================

document
.getElementById("removeLastBtn")
.addEventListener(

"click",

function() {


    if (
        trainPoints.length > 2
    ) {


        trainPoints.pop();


        atualizarModelos();

        atualizarVisibilidadeModelos();

    }

}

);



// ============================================================
// RESET
// ============================================================

document
.getElementById("resetBtn")
.addEventListener(

"click",

function() {


    trainPoints =
    JSON.parse(
        JSON.stringify(
            initialTrainPoints
        )
    );


    autoLinear.checked =
    true;


    showLinearModel.checked =
    true;


    showOverfitModel.checked =
    true;


    showLabels.checked =
    true;


    showResiduals.checked =
    false;


    degreeSlider.value =
    7;


    atualizarModelos();

    atualizarVisibilidadeModelos();

}

);



// ============================================================
// ADICIONAR PONTO CLICANDO NO GRÁFICO DE TREINO
// ============================================================

document
.getElementById("chartTrain")
.addEventListener(

"click",

function(evt) {


    var rect =
    evt.target
    .getBoundingClientRect();


    var xPixel =
    evt.clientX -
    rect.left;


    var yPixel =
    evt.clientY -
    rect.top;


    var xVal =
    chartTrain.scales.x
    .getValueForPixel(
        xPixel
    );


    var yVal =
    chartTrain.scales.y
    .getValueForPixel(
        yPixel
    );


    if (

        xVal >= 0

        &&

        xVal <= 10

        &&

        yVal >= 0

        &&

        yVal <= 100

    ) {


        var px =
        Number(
            xVal.toFixed(1)
        );


        var py =
        Math.round(
            yVal
        );


        inputX.value =
        px;


        inputY.value =
        py;


        trainPoints.push({

            x:
            px,

            y:
            py

        });


        atualizarModelos();

        atualizarVisibilidadeModelos();

    }

}

);



// ============================================================
// REMOVER PONTO COM BOTÃO DIREITO NO GRÁFICO DE TREINO
// ============================================================

document
.getElementById("chartTrain")
.addEventListener(

    "contextmenu",

    function(evt) {

        // Impede o menu de contexto padrão do navegador
        evt.preventDefault();


        // ========================================================
        // PROCURA O PONTO QUE ESTÁ SOB O CURSOR
        // ========================================================

        var pontosEncontrados =
        chartTrain.getElementsAtEventForMode(

            evt,

            "nearest",

            {
                intersect: true
            },

            false

        );


        // ========================================================
        // SE NÃO HOUVER PONTO SOB O CURSOR, NÃO FAZ NADA
        // ========================================================

        if (pontosEncontrados.length === 0) {

            return;

        }


        // ========================================================
        // PEGA O PRIMEIRO ELEMENTO ENCONTRADO
        // ========================================================

        var ponto =
        pontosEncontrados[0];


        // ========================================================
        // SOMENTE O DATASET 0 CONTÉM OS PONTOS DE TREINO
        // dataset 0 = pontos
        // dataset 1 = modelo linear
        // dataset 2 = modelo polinomial
        // ========================================================

        if (ponto.datasetIndex !== 0) {

            return;

        }


        // ========================================================
        // MANTÉM PELO MENOS DOIS PONTOS NO CONJUNTO DE TREINO
        // ========================================================

        if (trainPoints.length <= 2) {

            return;

        }


        // ========================================================
        // REMOVE O PONTO CORRESPONDENTE
        // ========================================================

        var indice =
        ponto.index;


        trainPoints.splice(
            indice,
            1
        );


        // ========================================================
        // RECALCULA MODELOS, TABELA, MÉTRICAS E GRÁFICOS
        // ========================================================

        atualizarModelos();

        atualizarVisibilidadeModelos();

    }

);



// ============================================================
// INICIALIZAÇÃO
// ============================================================

atualizarModelos();

atualizarVisibilidadeModelos();


</script>
