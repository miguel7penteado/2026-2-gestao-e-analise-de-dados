<iframe srcdoc='
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #f0f4f8; padding: 10px; border-radius: 6px; }
    .inputs-group { display: flex; align-items: center; gap: 6px; }
    .inputs-group input[type="number"] { width: 55px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    .sliders { width: 100%; display: flex; gap: 20px; margin-top: 5px; }
    .slider-group { flex: 1; }
    .slider-group label { display: block; font-size: 12px; font-weight: bold; }
    .slider-group input { width: 100%; }
    button { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-add { background: #28a745; color: white; }
    .btn-reset { background: #dc3545; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h3 style="text-align: center; margin: 0 0 10px 0;">Visualizador de Regressão Linear - Exemplo 1 - Valor Apartamento</h3>
    
    <div class="controls">
      <div>
        <label style="font-weight: bold; cursor: pointer;"><input type="checkbox" id="autoOls" checked> Auto-calcular modelo (menor erro)</label>
        <label style="font-weight: bold; cursor: pointer; margin-left: 10px;"><input type="checkbox" id="showResiduals" checked> Mostrar o erro (resíduo)</label>
      </div>

      <div class="inputs-group">
        <label style="font-size: 12px; font-weight: bold;">X:</label>
        <input type="number" id="inputX" min="20" max="100" value="65">
        <label style="font-size: 12px; font-weight: bold;">Y:</label>
        <input type="number" id="inputY" min="100" max="500" value="320">
        <button class="btn-add" id="addPointBtn">+ Add Point</button>
        <button class="btn-reset" id="resetBtn">Reset</button>
      </div>

      <div class="sliders">
        <div class="slider-group">
          <label>Parâmetro w, ou inclinação (β₁): <span id="beta1Val">3.90</span></label>
          <input type="range" id="beta1Slider" min="-5" max="10" step="0.1" value="3.90" disabled>
        </div>
        <div class="slider-group">
          <label>Parâmetro b, ou intercepto ou vício (β₀): <span id="beta0Val">61.00</span></label>
          <input type="range" id="beta0Slider" min="0" max="200" step="1" value="61.00" disabled>
        </div>
      </div>
    </div>

    <canvas id="chart" width="750" height="380"></canvas>
  </div>

  <script>
    var initialPoints = [{x: 40, y: 220}, {x: 50, y: 260}, {x: 60, y: 310}, {x: 70, y: 350}, {x: 80, y: 410}];
    var points = JSON.parse(JSON.stringify(initialPoints));
    var currentBeta0 = 61.0, currentBeta1 = 3.9;

    var autoOls = document.getElementById("autoOls");
    var showResiduals = document.getElementById("showResiduals");
    var beta1Slider = document.getElementById("beta1Slider");
    var beta0Slider = document.getElementById("beta0Slider");
    var inputX = document.getElementById("inputX");
    var inputY = document.getElementById("inputY");

    function calcOLS() {
      var n = points.length;
      if (n < 2) return { beta0: 0, beta1: 0 };
      var sx = 0, sy = 0, sxy = 0, sx2 = 0;
      for (var i = 0; i < n; i++) {
        sx += points[i].x; sy += points[i].y;
        sxy += points[i].x * points[i].y; sx2 += points[i].x * points[i].x;
      }
      var b1 = (n * sx2 - sx * sx) !== 0 ? (n * sxy - sx * sy) / (n * sx2 - sx * sx) : 0;
      var b0 = (sy - b1 * sx) / n;
      return { beta0: b0, beta1: b1 };
    }

    function calcMetrics(b0, b1) {
      var n = points.length;
      if (n === 0) return { loss: 0, mse: 0, r2: "0.00" };
      var sy = 0, sse = 0, sst = 0;
      for (var i = 0; i < n; i++) sy += points[i].y;
      var meanY = sy / n;
      for (var j = 0; j < n; j++) {
        var yHat = b0 + b1 * points[j].x;
        sse += Math.pow(points[j].y - yHat, 2);
        sst += Math.pow(points[j].y - meanY, 2);
      }
      var loss = Math.round(sse);
      var mse = Math.round(sse / n);
      var r2 = sst !== 0 ? Math.max(0, 1 - (sse / sst)).toFixed(2) : "1.00";
      return { loss: loss, mse: mse, r2: r2 };
    }

    var customPlugin = {
      id: "customPlugin",
      beforeDatasetsDraw: function(chart) {
        if (!showResiduals.checked) return;
        var ctx = chart.ctx, xAxis = chart.scales.x, yAxis = chart.scales.y;
        ctx.save(); ctx.strokeStyle = "#ff9999"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        for (var i = 0; i < points.length; i++) {
          var p = points[i], yHat = currentBeta0 + currentBeta1 * p.x;
          ctx.beginPath();
          ctx.moveTo(xAxis.getPixelForValue(p.x), yAxis.getPixelForValue(p.y));
          ctx.lineTo(xAxis.getPixelForValue(p.x), yAxis.getPixelForValue(yHat));
          ctx.stroke();
        }
        ctx.restore();
      },
      afterDraw: function(chart) {
        var ctx = chart.ctx; ctx.save();
        var meta = chart.getDatasetMeta(0);
        ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#000"; ctx.textAlign = "center";
        meta.data.forEach(function(el, idx) {
          if (points[idx]) ctx.fillText("(" + points[idx].x + ", " + points[idx].y + ")", el.x, el.y - 10);
        });
        
        var m = calcMetrics(currentBeta0, currentBeta1);
        var ca = chart.chartArea, bx = ca.right - 120, by = ca.bottom - 60;
        
        // Desenha caixa de métricas expandida com Loss
        ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#ccc"; ctx.lineWidth = 1;
        ctx.fillRect(bx, by, 110, 52); ctx.strokeRect(bx, by, 110, 52);
        
        ctx.font = "11px sans-serif"; ctx.fillStyle = "#000"; ctx.textAlign = "left";
        ctx.fillText("Loss (SSE) = " + m.loss, bx + 8, by + 16);
        ctx.fillText("MSE = " + m.mse, bx + 8, by + 31);
        ctx.fillText("R² = " + m.r2, bx + 8, by + 46);
        
        ctx.restore();
      }
    };

    var ctx = document.getElementById("chart").getContext("2d");
    var chart = new Chart(ctx, {
      type: "scatter",
      data: {
        datasets: [
          { label: "Pontos", data: points, backgroundColor: "blue", pointRadius: 5 },
          { label: "Reta", data: [], type: "line", borderColor: "red", borderWidth: 2, fill: false, pointRadius: 0 }
        ]
      },
      options: {
        responsive: true, animation: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { type: "linear", min: 20, max: 100, title: { display: true, text: "Entrada de dados X - Área Imóvel" } },
          y: { min: 100, max: 500, title: { display: true, text: "Saída de dados Y - Valor do imóvel" } }
        }
      },
      plugins: [customPlugin]
    });

    function update() {
      if (autoOls.checked) {
        var ols = calcOLS(); currentBeta0 = ols.beta0; currentBeta1 = ols.beta1;
        beta1Slider.disabled = beta0Slider.disabled = true;
        beta1Slider.value = currentBeta1.toFixed(2); beta0Slider.value = currentBeta0.toFixed(2);
      } else {
        beta1Slider.disabled = beta0Slider.disabled = false;
        currentBeta1 = parseFloat(beta1Slider.value); currentBeta0 = parseFloat(beta0Slider.value);
      }
      document.getElementById("beta1Val").innerText = currentBeta1.toFixed(2);
      document.getElementById("beta0Val").innerText = currentBeta0.toFixed(2);
      chart.data.datasets[0].data = points;
      chart.data.datasets[1].data = [{ x: 20, y: currentBeta0 + currentBeta1 * 20 }, { x: 100, y: currentBeta0 + currentBeta1 * 100 }];
      chart.update();
    }

    autoOls.addEventListener("change", update);
    showResiduals.addEventListener("change", update);
    beta1Slider.addEventListener("input", update);
    beta0Slider.addEventListener("input", update);

    document.getElementById("addPointBtn").addEventListener("click", function() {
      var xVal = parseFloat(inputX.value);
      var yVal = parseFloat(inputY.value);
      if (!isNaN(xVal) && !isNaN(yVal)) {
        points.push({ x: xVal, y: yVal });
        update();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", function() {
      points = JSON.parse(JSON.stringify(initialPoints)); 
      autoOls.checked = true; 
      update();
    });

    document.getElementById("chart").addEventListener("click", function(evt) {
      var rect = evt.target.getBoundingClientRect();
      var xVal = Math.round(chart.scales.x.getValueForPixel(evt.clientX - rect.left));
      var yVal = Math.round(chart.scales.y.getValueForPixel(evt.clientY - rect.top));
      if (xVal >= 20 && xVal <= 100 && yVal >= 100 && yVal <= 500) {
        inputX.value = xVal;
        inputY.value = yVal;
        points.push({ x: xVal, y: yVal });
        update();
      }
    });

    update();
  </script>
</body>
</html>' 
style="width: 100%; height: 560px; border: none; overflow: hidden;">
</iframe>
