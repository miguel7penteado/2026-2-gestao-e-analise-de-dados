<iframe srcdoc="
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;meta charset=&quot;utf-8&quot;&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/chart.js&quot;&gt;&lt;/script&gt;
  &lt;style&gt;
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #f0f4f8; padding: 10px; border-radius: 6px; }
    .inputs-group { display: flex; align-items: center; gap: 6px; }
    .inputs-group input[type=&quot;number&quot;] { width: 55px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    .sliders { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 5px; }
    .slider-group { flex: 1; }
    .slider-group label { display: block; font-size: 12px; font-weight: bold; }
    .slider-group input { width: 100%; }
    button { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-add { background: #28a745; color: white; }
    .btn-reset { background: #dc3545; color: white; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;container&quot;&gt;
    &lt;h3 style=&quot;text-align: center; margin: 0 0 10px 0;&quot;&gt;Visualizador de Regressão Logística - Função Sigmóide&lt;/h3&gt;
    
    &lt;div class=&quot;controls&quot;&gt;
      &lt;div&gt;
        &lt;label style=&quot;font-weight: bold; cursor: pointer;&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;showResiduals&quot; checked&gt; Mostrar resíduos (probabilidade vs real)&lt;/label&gt;
      &lt;/div&gt;

      &lt;div class=&quot;inputs-group&quot;&gt;
        &lt;label style=&quot;font-size: 12px; font-weight: bold;&quot;&gt;X:&lt;/label&gt;
        &lt;input type=&quot;number&quot; id=&quot;inputX&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;50&quot;&gt;
        &lt;label style=&quot;font-size: 12px; font-weight: bold;&quot;&gt;Y (0 ou 1):&lt;/label&gt;
        &lt;input type=&quot;number&quot; id=&quot;inputY&quot; min=&quot;0&quot; max=&quot;1&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;
        &lt;button class=&quot;btn-add&quot; id=&quot;addPointBtn&quot;&gt;+ Add Point&lt;/button&gt;
        &lt;button class=&quot;btn-reset&quot; id=&quot;resetBtn&quot;&gt;Reset&lt;/button&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sliders&quot;&gt;
        &lt;div class=&quot;slider-group&quot;&gt;
          &lt;label&gt;Peso w (inclinação): &lt;span id=&quot;weightVal&quot;&gt;0.15&lt;/span&gt;&lt;/label&gt;
          &lt;input type=&quot;range&quot; id=&quot;weightSlider&quot; min=&quot;-1.0&quot; max=&quot;1.0&quot; step=&quot;0.01&quot; value=&quot;0.15&quot;&gt;
        &lt;/div&gt;
        &lt;div class=&quot;slider-group&quot;&gt;
          &lt;label&gt;Vício b (bias): &lt;span id=&quot;biasVal&quot;&gt;-7.50&lt;/span&gt;&lt;/label&gt;
          &lt;input type=&quot;range&quot; id=&quot;biasSlider&quot; min=&quot;-30&quot; max=&quot;30&quot; step=&quot;0.5&quot; value=&quot;-7.50&quot;&gt;
        &lt;/div&gt;
        &lt;div class=&quot;slider-group&quot;&gt;
          &lt;label style=&quot;color: #d97706;&quot;&gt;Threshold (Limiar): &lt;span id=&quot;thresholdVal&quot;&gt;50%&lt;/span&gt;&lt;/label&gt;
          &lt;input type=&quot;range&quot; id=&quot;thresholdSlider&quot; min=&quot;0.0&quot; max=&quot;1.0&quot; step=&quot;0.01&quot; value=&quot;0.50&quot;&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;canvas id=&quot;chart&quot; width=&quot;750&quot; height=&quot;380&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;

  &lt;script&gt;
    var initialPoints = [
      {x: 10, y: 0}, {x: 20, y: 0}, {x: 30, y: 0}, {x: 40, y: 0},
      {x: 60, y: 1}, {x: 70, y: 1}, {x: 80, y: 1}, {x: 90, y: 1}
    ];
    var points = JSON.parse(JSON.stringify(initialPoints));
    var currentW = 0.15, currentB = -7.50, currentThreshold = 0.50;

    var showResiduals = document.getElementById(&quot;showResiduals&quot;);
    var weightSlider = document.getElementById(&quot;weightSlider&quot;);
    var biasSlider = document.getElementById(&quot;biasSlider&quot;);
    var thresholdSlider = document.getElementById(&quot;thresholdSlider&quot;);
    var inputX = document.getElementById(&quot;inputX&quot;);
    var inputY = document.getElementById(&quot;inputY&quot;);

    function sigmoid(z) {
      return 1 / (1 + Math.exp(-z));
    }

    function predict(x, w, b) {
      return sigmoid(w * x + b);
    }

    function getPredictedPoints(w, b) {
      return points.map(function(p) {
        return { x: p.x, y: predict(p.x, w, b) };
      });
    }

    function calcMetrics(w, b, threshold) {
      var n = points.length;
      if (n === 0) return { logLoss: &quot;0.000&quot;, accuracy: &quot;0.0%&quot; };
      
      var totalLoss = 0;
      var correct = 0;
      var eps = 1e-15;

      for (var i = 0; i &lt; n; i++) {
        var p = points[i];
        var yHat = predict(p.x, w, b);
        yHat = Math.max(eps, Math.min(1 - eps, yHat));
        
        var loss = -(p.y * Math.log(yHat) + (1 - p.y) * Math.log(1 - yHat));
        totalLoss += loss;

        var predClass = yHat &gt;= threshold ? 1 : 0;
        if (predClass === p.y) correct++;
      }

      var avgLoss = totalLoss / n;
      var acc = (correct / n) * 100;
      return { logLoss: avgLoss.toFixed(3), accuracy: acc.toFixed(1) + &quot;%&quot; };
    }

    function generateSigmoidCurve(w, b) {
      var curve = [];
      for (var x = 0; x &lt;= 100; x += 1) {
        curve.push({ x: x, y: predict(x, w, b) });
      }
      return curve;
    }

    function generateThresholdLine(t) {
      return [{ x: 0, y: t }, { x: 100, y: t }];
    }

    var customPlugin = {
      id: &quot;customPlugin&quot;,
      beforeDatasetsDraw: function(chart) {
        if (!showResiduals.checked) return;
        var ctx = chart.ctx, xAxis = chart.scales.x, yAxis = chart.scales.y;
        ctx.save(); ctx.strokeStyle = &quot;#ff9999&quot;; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        for (var i = 0; i &lt; points.length; i++) {
          var p = points[i];
          var yHat = predict(p.x, currentW, currentB);
          ctx.beginPath();
          ctx.moveTo(xAxis.getPixelForValue(p.x), yAxis.getPixelForValue(p.y));
          ctx.lineTo(xAxis.getPixelForValue(p.x), yAxis.getPixelForValue(yHat));
          ctx.stroke();
        }
        ctx.restore();
      },
      afterDraw: function(chart) {
        var ctx = chart.ctx; ctx.save();
        var metaReal = chart.getDatasetMeta(0);
        var metaPred = chart.getDatasetMeta(2);
        
        ctx.font = &quot;bold 10px sans-serif&quot;; ctx.textAlign = &quot;center&quot;;
        
        // Rótulos dos pontos reais
        ctx.fillStyle = &quot;#0000ff&quot;;
        metaReal.data.forEach(function(el, idx) {
          if (points[idx]) ctx.fillText(&quot;(&quot; + points[idx].x + &quot;, &quot; + points[idx].y + &quot;)&quot;, el.x, points[idx].y &gt; 0.5 ? el.y - 12 : el.y + 15);
        });

        // Rótulos dos pontos de probabilidade prevista (verde)
        ctx.fillStyle = &quot;#28a745&quot;;
        metaPred.data.forEach(function(el, idx) {
          if (points[idx]) {
            var yHat = predict(points[idx].x, currentW, currentB);
            ctx.fillText(&quot;P=&quot; + yHat.toFixed(2), el.x, el.y - 8);
          }
        });
        
        var m = calcMetrics(currentW, currentB, currentThreshold);
        var ca = chart.chartArea, bx = ca.right - 140, by = ca.bottom - 50;
        
        ctx.fillStyle = &quot;#ffffff&quot;; ctx.strokeStyle = &quot;#ccc&quot;; ctx.lineWidth = 1;
        ctx.fillRect(bx, by, 130, 42); ctx.strokeRect(bx, by, 130, 42);
        
        ctx.font = &quot;11px sans-serif&quot;; ctx.fillStyle = &quot;#000&quot;; ctx.textAlign = &quot;left&quot;;
        ctx.fillText(&quot;Log Loss = &quot; + m.logLoss, bx + 8, by + 16);
        ctx.fillText(&quot;Acurácia = &quot; + m.accuracy, bx + 8, by + 32);
        
        ctx.restore();
      }
    };

    var ctx = document.getElementById(&quot;chart&quot;).getContext(&quot;2d&quot;);
    var chart = new Chart(ctx, {
      type: &quot;scatter&quot;,
      data: {
        datasets: [
          { label: &quot;Pontos Reais (0 ou 1)&quot;, data: points, backgroundColor: &quot;blue&quot;, pointRadius: 5 },
          { label: &quot;Curva Sigmóide&quot;, data: generateSigmoidCurve(currentW, currentB), type: &quot;line&quot;, borderColor: &quot;red&quot;, borderWidth: 2, fill: false, pointRadius: 0 },
          { label: &quot;Probabilidade Predita P(Y=1|X)&quot;, data: getPredictedPoints(currentW, currentB), backgroundColor: &quot;#28a745&quot;, borderColor: &quot;#28a745&quot;, pointRadius: 6, pointStyle: &quot;circle&quot;, borderWidth: 2, fill: false },
          { label: &quot;Threshold (Limiar)&quot;, data: generateThresholdLine(currentThreshold), type: &quot;line&quot;, borderColor: &quot;#d97706&quot;, borderWidth: 2, borderDash: [6, 6], fill: false, pointRadius: 0 }
        ]
      },
      options: {
        responsive: true, animation: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { type: &quot;linear&quot;, min: 0, max: 100, title: { display: true, text: &quot;Variável de Entrada (X)&quot; } },
          y: { min: -0.05, max: 1.05, title: { display: true, text: &quot;Probabilidade P(Y=1|X)&quot; } }
        }
      },
      plugins: [customPlugin]
    });

    function update() {
      currentW = parseFloat(weightSlider.value);
      currentB = parseFloat(biasSlider.value);
      currentThreshold = parseFloat(thresholdSlider.value);
      
      document.getElementById(&quot;weightVal&quot;).innerText = currentW.toFixed(2);
      document.getElementById(&quot;biasVal&quot;).innerText = currentB.toFixed(2);
      document.getElementById(&quot;thresholdVal&quot;).innerText = Math.round(currentThreshold * 100) + &quot;%&quot;;
      
      chart.data.datasets[0].data = points;
      chart.data.datasets[1].data = generateSigmoidCurve(currentW, currentB);
      chart.data.datasets[2].data = getPredictedPoints(currentW, currentB);
      chart.data.datasets[3].data = generateThresholdLine(currentThreshold);
      chart.update();
    }

    showResiduals.addEventListener(&quot;change&quot;, update);
    weightSlider.addEventListener(&quot;input&quot;, update);
    biasSlider.addEventListener(&quot;input&quot;, update);
    thresholdSlider.addEventListener(&quot;input&quot;, update);

    document.getElementById(&quot;addPointBtn&quot;).addEventListener(&quot;click&quot;, function() {
      var xVal = parseFloat(inputX.value);
      var yVal = Math.round(parseFloat(inputY.value));
      yVal = Math.max(0, Math.min(1, yVal));
      if (!isNaN(xVal) &amp;&amp; !isNaN(yVal)) {
        points.push({ x: xVal, y: yVal });
        update();
      }
    });

    document.getElementById(&quot;resetBtn&quot;).addEventListener(&quot;click&quot;, function() {
      points = JSON.parse(JSON.stringify(initialPoints)); 
      weightSlider.value = 0.15;
      biasSlider.value = -7.50;
      thresholdSlider.value = 0.50;
      update();
    });

    document.getElementById(&quot;chart&quot;).addEventListener(&quot;click&quot;, function(evt) {
      var rect = evt.target.getBoundingClientRect();
      var xVal = Math.round(chart.scales.x.getValueForPixel(evt.clientX - rect.left));
      var rawY = chart.scales.y.getValueForPixel(evt.clientY - rect.top);
      var yVal = rawY &gt;= currentThreshold ? 1 : 0;
      
      if (xVal &gt;= 0 &amp;&amp; xVal &lt;= 100) {
        inputX.value = xVal;
        inputY.value = yVal;
        points.push({ x: xVal, y: yVal });
        update();
      }
    });

    update();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;" style="width: 100%; height: 560px; border: none; overflow: hidden;">
</iframe>
